[workspace]
resolver = "2"
members = ["crates/*"]

# apps/desktop/src-tauri entra no workspace quando as deps de sistema Tauri
# (libwebkit2gtk-4.1-dev …) estiverem presentes. Ver docs/architecture/.

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/angolardevops/delonix-desktop"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
