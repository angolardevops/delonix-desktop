# NOTA: este crate NÃO faz parte do workspace raiz (ver Cargo.toml de topo).
# Compilar a janela Tauri exige libs de sistema que podem faltar no host
# (ex.: libwebkit2gtk-4.1-dev). Instalar com o comando em docs/architecture/
# (uma acção `sudo` do dono, não executada pelo agente).
#
# Sub-workspace autónomo: a tabela `[workspace]` vazia diz ao cargo para NÃO o
# tratar como membro do workspace raiz (`crates/*`). Assim a janela compila
# localmente quando as libs existem, sem o CI (`cargo build --workspace`) tentar
# compilá-la nos runners sem webkit.
[workspace]

[package]
name = "delonix-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Delonix Desktop — ambiente de trabalho para Platform Engineering, SRE e DevOps sobre o Delonix Engine"

# A app passou a falar com o engine pela ponte CLI própria (src/cli.rs, com
# classificação de risco READ/SAFE_WRITE/DISRUPTIVE/DESTRUCTIVE) e por streams
# (src/stream.rs) — já não depende de `crates/delonix-desktop-core`, que fica
# órfão até à fase de consolidação.
[lib]
name = "delonix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread"] }
which = "6"
portable-pty = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]
